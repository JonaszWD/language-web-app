# ── Deploy stack — runs on EC2, pulls prebuilt images from GHCR ─────────────
# The CI job scps this file to the box and runs:
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
#
# IMAGE_BASE (e.g. ghcr.io/owner/repo) and TAG are injected via env by the
# deploy job. Only the frontend is published; backend/db/redis stay internal.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [app-net]

  backend:
    image: ${IMAGE_BASE}/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    command: sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - whisper-cache:/root/.cache/huggingface
      - podcast-audio:/data/podcasts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [app-net]

  frontend:
    image: ${IMAGE_BASE}/frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-net]

volumes:
  pgdata:
  whisper-cache:
  podcast-audio:

networks:
  app-net:
    driver: bridge
